<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="col" style="gap:12px;">
  <div class="row" style="gap:12px;">
    <div class="swatch" style="background:#D72222;"></div>
    <div class="col" style="gap:2px;">
      <div style="font-weight:700;font-size:15px;color:#000;">Danger · #D72222</div>
      <div class="muted">Destructive buttons, errors, required *</div>
    </div>
  </div>
  <div class="row" style="gap:12px;">
    <div class="swatch" style="background:#62D764;"></div>
    <div class="col" style="gap:2px;">
      <div style="font-weight:700;font-size:15px;color:#000;">Success · #62D764</div>
      <div class="muted">Completed, valid, success toasts</div>
    </div>
  </div>
  <div class="row" style="gap:12px;">
    <div class="swatch" style="background:#FFBF00;"></div>
    <div class="col" style="gap:2px;">
      <div style="font-weight:700;font-size:15px;color:#000;">Warning · #FFBF00</div>
      <div class="muted">Operations memo border (fill #FFF9EB)</div>
    </div>
  </div>
  <div class="row" style="gap:12px;">
    <div class="swatch" style="background:#1B45D2;"></div>
    <div class="col" style="gap:2px;">
      <div style="font-weight:700;font-size:15px;color:#000;">Info · #1B45D2</div>
      <div class="muted">Informational links (rare)</div>
    </div>
  </div>
</div>
</body></html>
