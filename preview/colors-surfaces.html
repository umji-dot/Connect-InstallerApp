<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="col" style="gap:14px;">
  <div class="row" style="gap:12px;align-items:flex-start;">
    <div class="swatch" style="background:#FFF9EB;border:1px solid #FFBF00;"></div>
    <div class="col" style="gap:2px;flex:1;">
      <div style="font-weight:700;font-size:15px;color:#000;">Memo background</div>
      <div class="mono">bg #FFF9EB · border #FFBF00</div>
      <div class="muted">Operations memo card</div>
    </div>
  </div>
  <div class="row" style="gap:12px;align-items:flex-start;">
    <div class="swatch" style="background:#F7FDF7;border:1px solid #62D764;"></div>
    <div class="col" style="gap:2px;flex:1;">
      <div style="font-weight:700;font-size:15px;color:#000;">Completed row</div>
      <div class="mono">bg #F7FDF7 · border #62D764</div>
      <div class="muted">Completed list row fill</div>
    </div>
  </div>
  <div class="row" style="gap:12px;align-items:flex-start;">
    <div class="swatch" style="background:rgba(98,215,100,0.10);border:1px solid #62D764;"></div>
    <div class="col" style="gap:2px;flex:1;">
      <div style="font-weight:700;font-size:15px;color:#000;">Toast · Success</div>
      <div class="mono">bg rgba(98,215,100,.10) · backdrop blur 4</div>
    </div>
  </div>
  <div class="row" style="gap:12px;align-items:flex-start;">
    <div class="swatch" style="background:rgba(215,34,34,0.08);border:1px solid #D72222;"></div>
    <div class="col" style="gap:2px;flex:1;">
      <div style="font-weight:700;font-size:15px;color:#000;">Toast · Error</div>
      <div class="mono">bg rgba(215,34,34,.10) · backdrop blur 4</div>
    </div>
  </div>
</div>
</body></html>
