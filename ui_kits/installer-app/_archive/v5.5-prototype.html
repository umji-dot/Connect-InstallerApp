<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>Connect Installer v5.5 · 검증 단계 프로토타입</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="../../colors_and_type.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #EAEAEC;
      font-family: var(--font-sans); color: var(--n-900); min-height: 100vh; }
    .stage { min-height: 100vh; display: flex; align-items: flex-start;
      justify-content: center; gap: 24px; padding: 24px;
      flex-wrap: wrap; }
    .col { display: flex; flex-direction: column; gap: 12px; }
    .col-side { width: 320px; }
    .col-side .panel { background: white; border: 1px solid #E0E0E3;
      border-radius: 12px; padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
    .col-side h3 { margin: 0 0 8px; font-size: 11px; font-weight: 700;
      text-transform: uppercase; color: #66666F; letter-spacing: 0.5px; }
    .col-side .group { display: flex; flex-direction: column; gap: 4px;
      margin-bottom: 14px; }
    .col-side button { all: unset; cursor: pointer;
      padding: 8px 12px; border-radius: 8px; font-size: 13px;
      font-weight: 600; color: #484851;
      transition: background 0.12s ease; line-height: 1.3; }
    .col-side button:hover { background: #F2F2F3; }
    .col-side button.active { background: #223240; color: white; }
    .col-side button.danger { color: #D72222; }
    .col-side button.danger.active { background: #D72222; color: white; }
    .col-side .meta { font-size: 11px; color: #9797A0; line-height: 1.5;
      margin-top: 4px; }
    .frame-wrap { display: flex; flex-direction: column;
      align-items: center; gap: 12px; }
    .frame-wrap .label { font-size: 12px; color: #66666F; font-weight: 700; }
    .badge-v55 { display: inline-block; padding: 2px 6px;
      background: #FFBF00; color: #1D2A38; border-radius: 4px;
      font-size: 9px; font-weight: 800; margin-left: 4px;
      letter-spacing: 0.3px; }
  </style>
</head>
<body>
  <div class="stage">
    <aside class="col col-side">
      <div class="panel">
        <h3>화면 이동</h3>
        <div class="group" id="screen-nav">
          <button data-screen="list">1. 배정 작업 목록</button>
          <button data-screen="detail">2. 작업 상세</button>
          <button data-screen="config">3. 설정 페이지</button>
          <button data-screen="validation">4. 검증 진행</button>
          <button data-screen="result">5. 검증 결과</button>
          <button data-screen="unable">6. 작업 불가 시트</button>
        </div>

        <h3>OBD 검증 시나리오</h3>
        <div class="group" id="obd-nav">
          <button data-scenario="obd-normal">정상 8단계 진행</button>
          <button data-scenario="ex-02" class="danger">EX-02 OBD 초기화 실패</button>
          <button data-scenario="ex-14" class="danger">EX-14 CarDB 설치 실패<span class="badge-v55">v5.5</span></button>
          <button data-scenario="ex-15" class="danger">EX-15 CarDB 검증 실패<span class="badge-v55">v5.5</span></button>
          <button data-scenario="ex-03" class="danger">EX-03 6/8 시동 미감지</button>
          <button data-scenario="ex-05" class="danger">EX-05 시동잠금 실패</button>
        </div>

        <h3>Non-OBD 시나리오</h3>
        <div class="group" id="nobd-nav">
          <button data-scenario="nobd-normal">Non-OBD 정상</button>
          <button data-scenario="ex-12" class="danger">EX-12 시동 ON 타임아웃</button>
          <button data-scenario="ex-13" class="danger">EX-13 시동 OFF 타임아웃</button>
        </div>

        <div class="meta">
          <strong>v5.5 변경:</strong> 오류 팝업의 <code>[재시도]</code>는
          오류 발생 단계부터만 재진행. EX-14는 step 1부터,
          EX-15는 step 2부터 — 이미 성공한 상위 단계 재수행 X.
        </div>
      </div>
    </aside>

    <div class="frame-wrap">
      <div id="root"></div>
      <div class="label">Connect Installer · iPhone 15 · v5.5</div>
    </div>
  </div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="tokens.js"></script>
  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="Primitives.jsx"></script>
  <script type="text/babel" src="v5.5/ValidationFlow.jsx"></script>
  <script type="text/babel" src="v5.5/Screens.jsx"></script>
  <script type="text/babel" src="v5.5/App.jsx"></script>
</body>
</html>
