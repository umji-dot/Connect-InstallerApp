<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>설치 작업 목록 — Connect Installer</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="../colors_and_type.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: #EAEAEC;
      font-family: var(--font-sans);
      color: var(--n-900);
      min-height: 100vh;
    }
    .stage {
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 32px;
      padding: 32px 24px;
      flex-wrap: wrap;
    }
    .frame-wrap {
      display: flex; flex-direction: column;
      align-items: center; gap: 12px;
    }
    .frame-wrap .label {
      font-size: 13px;
      color: var(--n-600);
      font-weight: 700;
    }
    .frame-wrap .case {
      font-size: 14px;
      color: var(--n-900);
      font-weight: 700;
      padding: 4px 12px;
      background: white;
      border-radius: 999px;
      border: 1px solid var(--n-300);
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="frame-wrap">
      <div class="case">A. 미완료 (시작 전)</div>
      <div id="root-a"></div>
      <div class="label">검증하기 비활성</div>
    </div>
    <div class="frame-wrap">
      <div class="case">B. 진행중 (위저드 중단 복귀)</div>
      <div id="root-b"></div>
      <div class="label">검증하기 비활성</div>
    </div>
    <div class="frame-wrap">
      <div class="case">C. 완료</div>
      <div id="root-c"></div>
      <div class="label">검증하기 활성</div>
    </div>
  </div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="../ui_kits/installer-app/tokens.js"></script>
  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="../ui_kits/installer-app/Primitives.jsx"></script>
  <script type="text/babel" src="../ui_kits/installer-app/InstallTaskListScreen.jsx"></script>

  <script type="text/babel" data-presets="env,react">
    const SAMPLE_JOB = {
      plate: "12가 3456",
      model: "현대 셀토스",
    };

    function Frame({ rootId, label, tasks }) {
      return (
        <IOSDevice width={402} height={874}>
          <div data-screen-label={`03 설치 작업 목록 · ${label}`} style={{
            width: "100%", height: "100%",
            paddingTop: 54,
            paddingBottom: 34,
            boxSizing: "border-box",
            display: "flex", flexDirection: "column",
            background: window.CIT.colors.n50,
            fontFamily: window.CIT.font.family,
          }}>
            <InstallTaskListScreen
              job={SAMPLE_JOB}
              tasks={tasks}
              onBack={() => console.log("back")}
              onTaskTap={(t) => console.log("task", t.id)}
              onValidate={() => console.log("validate")}
            />
          </div>
        </IOSDevice>
      );
    }

    ReactDOM.createRoot(document.getElementById("root-a")).render(
      <Frame label="A 미완료" tasks={[{ id: "install", title: "설치 작업", status: "incomplete" }]} />
    );
    ReactDOM.createRoot(document.getElementById("root-b")).render(
      <Frame label="B 진행중" tasks={[{ id: "install", title: "설치 작업", status: "progress" }]} />
    );
    ReactDOM.createRoot(document.getElementById("root-c")).render(
      <Frame label="C 완료" tasks={[{ id: "install", title: "설치 작업", status: "complete" }]} />
    );
  </script>
</body>
</html>
